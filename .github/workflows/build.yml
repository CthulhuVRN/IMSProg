name: Build

on:
  push:
    branches-ignore:
      - "debian/**"
    paths-ignore:
      - "README.md"
      - "**/README.md"
      - "**/index.html"
  pull_request:
    branches-ignore:
      - "debian/**"
    paths-ignore:
      - "README.md"
      - "**/README.md"
      - "**/index.html"
  workflow_dispatch:

env:
  CMAKE_INSTALL_PARALLEL_LEVEL: 4

jobs:
  amd64:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Optimized layout: Keeping only target production Ubuntu systems
        name: [Ubuntu-22, Ubuntu-24, Ubuntu-26]
        cpp_compiler: [g++]
        include:
          - name: Ubuntu-22
            image: "ubuntu:22.04"
            ubuntu: 22
            deps: cmake g++ libusb-1.0-0-dev qtbase5-dev qttools5-dev pkgconf udev libftdi1-dev file
          - name: Ubuntu-24
            image: "ubuntu:24.04"
            ubuntu: 24
            deps: cmake g++ libusb-1.0-0-dev pkgconf qt6-base-dev qt6-tools-dev linguist-qt6 qt6-l10n-tools qt6-base-dev-tools qt6-tools-dev-tools systemd-dev libftdi1-dev file
          - name: Ubuntu-26
            image: "ubuntu:26.04"
            ubuntu: 26
            deps: cmake g++ libusb-1.0-0-dev pkgconf qt6-base-dev qt6-tools-dev linguist-qt6 qt6-l10n-tools qt6-base-dev-tools qt6-tools-dev-tools libftdi1-dev systemd-dev file
    container:
      image: ${{ matrix.image }}
      env:
        LANG: en_US.UTF-8
        CC: ${{ matrix.c_compiler }}
        CXX: ${{ matrix.cpp_compiler }}
        WITH_PROJ: ON
        APT_LISTCHANGES_FRONTEND: none
        DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install packages required
        shell: bash
        run: |
          echo "Installing dependencies for ${{ matrix.name }}"
          apt-get update -qq
          apt-get install -yq ${{ matrix.deps }}
      
      - uses: actions/checkout@v7
      
      - name: Build and Package DEB
        working-directory: .
        run: |
          cmake -S . -B build/ -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ --parallel
          cmake --install build/
          
          cd build
          cpack -G DEB \
            -D CPACK_PACKAGE_NAME="imsprog" \
            -D CPACK_PACKAGE_VENDOR="BigBigMDM" \
            -D CPACK_PACKAGE_VERSION="1.8.6" \
            -D CPACK_PACKAGE_DESCRIPTION_SUMMARY="IMSProg - I2C/SPI/MicroWire Flash Programmer Suite" \
            -D CPACK_PACKAGE_DESCRIPTION="IMSProg is a Linux/macOS programmer suite for I2C, SPI, and MicroWire EEPROM/Flash chips, featuring fully integrated database management, hardware controllers, and visual editor tools." \
            -D CPACK_PACKAGE_CONTACT="BigBigMDM <https://github.com>" \
            -D CPACK_DEBIAN_PACKAGE_SHLIBDEPS=ON \
            -D CPACK_DEBIAN_PACKAGE_ARCHITECTURE="amd64" \
            -D CPACK_INSTALL_CMAKE_PROJECTS=".;IMSProg;ALL;/" \
            -D CPACK_PACKAGE_FILE_NAME="imsprog" \
            -D CPACK_CMAKE_GENERATOR="Unix Makefiles"
          
          mkdir -p ../dist-deb
          mv imsprog*.deb ../dist-deb/imsprog-${{ matrix.name }}-amd64.deb

      - name: Upload DEB Artifacts
        uses: actions/upload-artifact@main
        with:
          name: deb-${{ matrix.name }}
          path: dist-deb/*.deb

  fedora-rpm:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          dnf install -y dnf-plugins-core rpm-build rpmlint rpmdevtools wget \
                         hunspell-es hunspell-it hunspell-pt libftdi-devel
          dnf builddep -y rpm/*.spec
      - name: Prepare build environment
        run: |
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp rpm/*.spec ~/rpmbuild/SPECS/
          spectool -g -R ~/rpmbuild/SPECS/*.spec
      - name: Build RPM package
        run: |
          rpmbuild -ba ~/rpmbuild/SPECS/*.spec
      - name: Check RPM with rpmlint
        run: |
          rpmlint ~/rpmbuild/RPMS/*/*.rpm || true
      - name: Upload RPM Artifacts
        uses: actions/upload-artifact@main
        with:
          name: fedora-44-rpm
          path: ~/rpmbuild/RPMS/*/*.rpm

  # --- MacOS ---
  macos:
    runs-on: macos-26
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Install dependencies via Homebrew
        run: |
          HOMEBREW_NO_INSTALL_FROM_API=1 brew update
          brew upgrade
          brew install qt@6 libusb pkg-config libftdi

      - name: Configure CMake
        run: |
          export PKG_CONFIG_PATH="/opt/homebrew/lib/pkgconfig:$PKG_CONFIG_PATH"
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$(brew --prefix qt@6) \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_EXE_LINKER_FLAGS="-L/opt/homebrew/lib"

      - name: Build Application
        run: |
          cmake --build build --config Release --parallel

      - name: Prepare Deployment Artifacts (Create Multi-App DMG)
        run: |
          # 0. Prepare some reusable functions
          do_iconset() {
            local IMAGE_PATH=$1
            local ICONSET_PATH=$2

            mkdir image_iconset
            sips -z 16 16 -s format png "$IMAGE_PATH" --out icon.iconset/icon_16x16.png
            sips -z 32 32 -s format png "$IMAGE_PATH" --out icon.iconset/icon_16x16@2x.png
            sips -z 32 32 -s format png "$IMAGE_PATH" --out icon.iconset/icon_32x32.png
            sips -z 64 64 -s format png "$IMAGE_PATH" --out icon.iconset/icon_32x32@2x.png
            sips -z 128 128 -s format png "$IMAGE_PATH" --out icon.iconset/icon_128x128.png
            sips -z 256 256 -s format png "$IMAGE_PATH" --out icon.iconset/icon_128x128@2x.png
            sips -z 256 256 -s format png "$IMAGE_PATH" --out icon.iconset/icon_256x256.png
            sips -z 512 512 -s format png "$IMAGE_PATH" --out icon.iconset/icon_256x256@2x.png

            iconutil -c icns image_iconset -o "$ICONSET_PATH"
            rm -rf image_iconset
          }

          do_plist() {
            local CONTENTS_DIR_PATH=$1
            local ICON_PATH=$2
            local BINARY_PATH=$3
          
            /usr/libexec/PlistBuddy -c 'Add :CFBundleDevelopmentRegion string English' "$CONTENTS_DIR_PATH/Info.plist" 1>/dev/null
            /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string $ICON_PATH" "$CONTENTS_DIR_PATH/Info.plist"
            /usr/libexec/PlistBuddy -c 'Add :CFBundleInfoDictionaryVersion string 6.0' "$CONTENTS_DIR_PATH/Info.plist"
            /usr/libexec/PlistBuddy -c 'Add :CFBundlePackageType string APPL' "$CONTENTS_DIR_PATH/Info.plist"
            /usr/libexec/PlistBuddy -c 'Add :CFBundleShortVersionString string 0.2' "$CONTENTS_DIR_PATH/Info.plist"
            /usr/libexec/PlistBuddy -c 'Add :CFBundleVersion string 0.2-10' "$CONTENTS_DIR_PATH/Info.plist"
            /usr/libexec/PlistBuddy -c 'Add :NSPrincipalClass string NSApplication' "$CONTENTS_DIR_PATH/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string $BINARY_PATH" "$CONTENTS_DIR_PATH/Info.plist"
            /usr/libexec/PlistBuddy -c 'Add :LSUIElement bool true' "$CONTENTS_DIR_PATH/Info.plist"
          }
        
          # 1. Prepare staging app bundles for our final disk image
          for APP in \
            IMSProg \
            IMSProg_editor \
            IMSProg_database_update
          do
            CONTENTS_DIR_PATH="dmg_staging/$APP.app/Contents"
            BINARY_PATH="$CONTENTS_DIR_PATH/MacOS/$APP"
            ICONSET_PATH="$CONTENTS_DIR_PATH/Resources"
            
            mkdir -p "$CONTENTS_DIR_PATH/MacOS"
            mkdir -p "$CONTENTS_DIR_PATH/Resources"
            
            case $APP in
              IMSProg)
                cp build/$APP_programmer/$APP $BINARY_PATH
                
                ICON_PATH="IMSProg_programmer/img/IMSProg64.png"
                do_iconset $ICON_PATH $ICONSET_PATH
                do_plist $CONTENTS_DIR_PATH $ICON_PATH $BINARY_PATH
                ;;
              IMSProg_editor)
                cp build/$APP/$APP $BINARY_PATH
                
                ICON_PATH="IMSProg_editor/img/chipEdit64.png"
                do_iconset $ICON_PATH $ICONSET_PATH
                do_plist $CONTENTS_DIR_PATH $ICON_PATH $BINARY_PATH
                ;;
              IMSProg_database_update)
                cp build/$APP/$APP $BINARY_PATH
                
                ICON_PATH="IMSProg_database_update/img/IMSProg_database_update.png"
                do_iconset $ICON_PATH $ICONSET_PATH
                do_plist $CONTENTS_DIR_PATH $ICON_PATH $BINARY_PATH
                ;;
            esac
          done
            
          # 2. Inject runtime environment overrides so deployment utilities find the dynamic libusb
          export DYLD_LIBRARY_PATH="/opt/homebrew/lib:$DYLD_LIBRARY_PATH"

          # 3. Run macdeployqt on every application sequentially to bundle dependencies standalone
          echo "Processing standalone dependencies with macdeployqt..."
          $(brew --prefix qt@6)/bin/macdeployqt dmg_staging/IMSProg.app
          $(brew --prefix qt@6)/bin/macdeployqt dmg_staging/IMSProg_editor.app
          $(brew --prefix qt@6)/bin/macdeployqt dmg_staging/IMSProg_database_update.app

          # 4. Create the final unified graphical DMG image containing all three configured apps
          # We use the built-in hdiutil tool to generate a professional distribution image
          echo "Compiling the final unified multi-app DMG file..."
          hdiutil create -volname "IMSProg Programmer Suite" -srcfolder dmg_staging -ov -format UDZO imsprog-macos-arm64.dmg
          
          # Move file to artifacts upload root
          mkdir -p dist-dmg
          mv imsprog-macos-arm64.dmg dist-dmg/

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@main
        with:
          name: macos-arm64-dmg
          path: dist-dmg/*.dmg
